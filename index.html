<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calculadoras Pediátricas</title>

<style>
:root{
  --bg:#f8f5ff;
  --card:#ffffff;
  --text:#251b35;
  --muted:#746883;
  --border:#eadff7;
  --shadow:0 8px 24px rgba(90,42,160,.09);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,#efe7ff 0,#f8f5ff 36%,#eefaff 100%);
}

.wrap{
  width:100%;
  max-width:1120px;
  margin:auto;
  padding:16px 20px 28px;
}

/* Cabeçalho mais compacto */
header{
  padding:10px 0 14px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;
  color:#5b21b6;
  background:#fff;
  border:1px solid var(--border);
  border-radius:999px;
  box-shadow:0 5px 14px rgba(90,42,160,.07);
}

h1{
  margin:10px 0 0;
  font-size:clamp(28px,5vw,44px);
  line-height:1.05;
  color:#4c1d95;
}

/* Título dos módulos */
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:8px 0 10px;
}

.section-title h2{
  margin:0;
  font-size:18px;
  color:#4c1d95;
}

#count{
  font-size:12px;
  color:var(--muted);
}

/* Grade compacta */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;
}

/* Cartões menores */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:138px;
  padding:15px;
  overflow:hidden;

  color:inherit;
  text-decoration:none;
  background:rgba(255,255,255,.94);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    border-color .15s ease;
}

.card:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--accent,#7c3aed) 25%,var(--border));
  box-shadow:0 13px 30px rgba(90,42,160,.14);
}

.card::before{
  content:"";
  position:absolute;
  right:-38px;
  bottom:-48px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:var(--accent,#7c3aed);
  opacity:.10;
}

.icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex-shrink:0;

  font-size:22px;
  border-radius:13px;
  background:color-mix(in srgb,var(--accent,#7c3aed) 14%,white);
}

.card h3{
  position:relative;
  z-index:1;
  margin:0;
  font-size:17px;
  line-height:1.2;
  color:#27133f;
}

.card p{
  position:relative;
  z-index:1;
  margin:0;
  font-size:13px;
  line-height:1.4;
  color:var(--muted);
}

@media(max-width:720px){
  .wrap{
    padding:12px 14px 24px;
  }

  header{
    padding-top:6px;
  }

  h1{
    margin-top:8px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:10px;
  }

  .card{
    min-height:auto;
    padding:14px;
    border-radius:18px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="section-title">
    <h2>Módulos</h2>
    <span id="count"></span>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>
const modules = [
  {
    title:'Emergências Gerais + Medicações',
    desc:'Acesso rápido às principais condutas e cálculos de emergência pediátrica.',
    href:'emergencia.html',
    icon:'🚨',
    accent:'#b91c1c'
  },
  {
    title:'CAD',
    desc:'CETOADICOSE DIABÉTICA.',
    href:'CAD.html',
    icon:'🍬',
    accent:'#b91c1c'
  },
  {
    title:'Febre sem Sinais Localizatórios',
    desc:'Fluxograma por idade, exames e conduta.',
    href:'fssl.html',
    icon:'🌡️',
    accent:'#ef4444'
  },
  {
    title:'Infecção do Trato Urinário',
    desc:'Investigação, tratamento VO ou EV e cálculo por peso.',
    href:'itu.html',
    icon:'🧫',
    accent:'#14b8a6'
  },
  {
    title:'OMA e Otite Externa',
    desc:'Diagnóstico, analgesia e antibioticoterapia.',
    href:'oma.html',
    icon:'👂',
    accent:'#ec4899'
  },
  {
    title:'Pneumonia',
    desc:'Gravidade, critérios de internação e antibioticoterapia.',
    href:'pneumonia.html',
    icon:'🩻',
    accent:'#6366f1'
  },
  {
    title:'DRGE',
    desc:'Avaliação, tratamento, prescrição e orientações por faixa etária.',
    href:'drge.html',
    icon:'🔥',
    accent:'#ea580c'
  },
  {
    title:'Infecções Cutâneas',
    desc:'Avaliação de gravidade, antibioticoterapia e conduta.',
    href:'infeccoes-cutaneas.html',
    icon:'🩹',
    accent:'#db2777'
  },
  {
    title:'Violência Sexual',
    desc:'Atendimento inicial, profilaxias e seguimento.',
    href:'violencia-sexual.html',
    icon:'🛡️',
    accent:'#8b5cf6'
  },
  {
    title:'ALEITAMENTO MATERNO',
    desc:'APLV, Fórmulas.',
    href:'leite.html',
    icon:'🍼',
    accent:'#FAF9F6'
  },
  {
    title:'Prurigo estrófulo / urticária papular',
    desc:'Picadas de inseto',
    href:'picada.html',
    icon:'🦟',
    accent:'#895129'
  }
];

const grid = document.getElementById('grid');
const count = document.getElementById('count');

function render(){
  count.textContent = `${modules.length} módulos`;

  grid.innerHTML = modules.map(module => `
    <a
      class="card"
      href="${module.href}"
      style="--accent:${module.accent}"
    >
      <div class="icon">${module.icon}</div>
      <h3>${module.title}</h3>
      <p>${module.desc}</p>
    </a>
  `).join('');
}

render();
</script>

</body>
</html>

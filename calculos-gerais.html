
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Pediátrica Integrada — Medicações e Antibióticos</title>
<style>
:root{--navy:#17365d;--blue:#315d9b;--bg:#f5f7fa;--line:#dbe2ea;--text:#172033}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.app-header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;box-shadow:0 3px 14px #102a4c33}
.header-inner{max-width:1720px;margin:auto;min-height:76px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:#ffffff22;border:1px solid #ffffff55;display:grid;place-items:center;font-weight:900;font-size:19px;flex:none}
.brand h1{font-size:21px;margin:0;white-space:nowrap}
.app-tabs{display:flex;gap:7px;padding:5px;background:#ffffff1f;border:1px solid #ffffff33;border-radius:12px}
.tab-btn{border:0;border-radius:9px;padding:9px 14px;background:transparent;color:#fff;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.tab-btn:hover{background:#ffffff18}
.tab-btn.active{background:#fff;color:var(--navy);box-shadow:0 2px 7px #102a4c33}
.workspace{display:none}
.workspace.active{display:block}
.frame-shell{max-width:1720px;margin:auto;padding:10px 12px 12px}
.module-frame{display:block;width:100%;height:calc(100dvh - 98px);min-height:560px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 3px 14px #1c35551a}
@media(max-width:720px){
 .header-inner{min-height:88px;padding:10px 10px;align-items:stretch;flex-direction:column;gap:8px}
 .brand{justify-content:center} .brand-mark{display:none} .brand h1{font-size:18px}
 .app-tabs{width:100%} .tab-btn{flex:1;padding:9px 7px}
 .frame-shell{padding:7px} .module-frame{height:calc(100dvh - 116px);min-height:500px;border-radius:12px}
}
@media print{.app-header{display:none}.frame-shell{padding:0}.module-frame{height:auto;min-height:0;border:0;box-shadow:none}}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="brand"><div class="brand-mark">P</div><h1>Calculadora Pediátrica</h1></div>
    <nav class="app-tabs" aria-label="Módulos da calculadora">
      <button id="tab-meds" class="tab-btn active" type="button" onclick="openModule('meds')">Medicações</button>
      <button id="tab-atb" class="tab-btn" type="button" onclick="openModule('atb')">Antibióticos</button>
    </nav>
  </div>
</header>

<section id="workspace-meds" class="workspace active">
  <div class="frame-shell"><iframe id="frame-meds" class="module-frame" title="Medicações pediátricas"></iframe></div>
</section>
<section id="workspace-atb" class="workspace">
  <div class="frame-shell"><iframe id="frame-atb" class="module-frame" title="Antibioticoterapia pediátrica"></iframe></div>
</section>

const blobUrls = {};
const patient = {age:'', ageUnit:'years', weight:''};

function loadFrame(name) {
  const frame=document.getElementById('frame-'+name);
  if(frame.dataset.loaded==='1') return;
  const html=new TextDecoder().decode(Uint8Array.from(atob(EMBEDDED[name]), c=>c.charCodeAt(0)));
  blobUrls[name]=URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
  frame.src=blobUrls[name];
  frame.dataset.loaded='1';
}
function syncTo(name) {
  const frame=document.getElementById('frame-'+name);
  if(frame?.contentWindow) frame.contentWindow.postMessage({type:'pedicalc-sync-patient',...patient}, '*');
}
function openModule(name) {
  ['meds','atb'].forEach(key=>{
    document.getElementById('workspace-'+key).classList.toggle('active',key===name);
    document.getElementById('tab-'+key).classList.toggle('active',key===name);
  });
  loadFrame(name);
  setTimeout(()=>syncTo(name),120);
}
window.addEventListener('message', event=>{
  const d=event.data||{};
  if(d.type==='pedicalc-patient') {
    patient.age=d.age ?? patient.age;
    patient.ageUnit=d.ageUnit || patient.ageUnit;
    patient.weight=d.weight ?? patient.weight;
    syncTo(d.source==='meds'?'atb':'meds');
  } else if(d.type==='pedicalc-ready') {
    syncTo(d.source);
  }
});
window.addEventListener('beforeunload',()=>Object.values(blobUrls).forEach(URL.revokeObjectURL));
loadFrame('meds');
loadFrame('atb');
</script>
</body>
</html>
